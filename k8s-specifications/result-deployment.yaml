apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - image: ghcr.io/yash-negi/result:4bf39bb399f49a4e78b567f7f7e2ea5d86d42e74
        name: result
        ports:
        - containerPort: 80
          name: result
