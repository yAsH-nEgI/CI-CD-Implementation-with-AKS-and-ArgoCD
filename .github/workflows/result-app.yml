name: Build and Push Result Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'result/**'
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}
          
      - name: Convert repository owner to lowercase
        id: lowercase
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./result
          file: ./result/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/result:latest
            ghcr.io/${{ env.OWNER_LC }}/result:${{ github.sha }}
            
      - name: Update image tag in result-deployment.yml
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} /tmp/temp_repo
          cd /tmp/temp_repo
          sed -i "s|image:.*|image: ghcr.io/${{ env.OWNER_LC }}/result:${{ github.sha }}|g" k8s-specifications/result-deployment.yaml
          git config user.name "Yash Negi"
          git config user.email "yashnegi822002@gmail.com"
          git add .
          git commit -m "Update result image tag to ${{ github.sha }}"
          git push
          echo "Updated result image to ghcr.io/${{ env.OWNER_LC }}/result:${{ github.sha }}"
          rm -rf /tmp/temp_repo
